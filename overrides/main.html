{% extends "base.html" %}

{% block container %}
  {{ super() }}

  <!-- Floating Sidebar Expand Buttons (Visible when sidebars are collapsed) -->
  <button type="button" class="sidebar-expand-tab sidebar-expand-tab--left" id="sidebar-expand-left" title="Expand Primary Sidebar" aria-label="Expand Primary Sidebar">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>
      <line x1="9" x2="9" y1="3" y2="21"/>
    </svg>
  </button>

  <button type="button" class="sidebar-expand-tab sidebar-expand-tab--right" id="sidebar-expand-right" title="Expand Auxiliary Panel" aria-label="Expand Auxiliary Panel">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>
      <line x1="15" x2="15" y1="3" y2="21"/>
    </svg>
  </button>

  <script>
    (function() {
      function applyPanelState() {
        if (localStorage.getItem('panel-left-collapsed') === 'true') {
          document.body.classList.add('panel-left-collapsed');
        } else {
          document.body.classList.remove('panel-left-collapsed');
        }
        if (localStorage.getItem('panel-right-collapsed') === 'true') {
          document.body.classList.add('panel-right-collapsed');
        } else {
          document.body.classList.remove('panel-right-collapsed');
        }
      }

      applyPanelState();

      function setupPanelToggles() {
        applyPanelState();

        var btnLeftCollapse = document.getElementById('sidebar-toggle-left');
        var btnLeftExpand = document.getElementById('sidebar-expand-left');
        var btnRightCollapse = document.getElementById('sidebar-toggle-right');
        var btnRightExpand = document.getElementById('sidebar-expand-right');

        if (btnLeftCollapse && !btnLeftCollapse._bound) {
          btnLeftCollapse._bound = true;
          btnLeftCollapse.addEventListener('click', function(e) {
            e.preventDefault();
            document.body.classList.add('panel-left-collapsed');
            localStorage.setItem('panel-left-collapsed', 'true');
          });
        }

        if (btnLeftExpand && !btnLeftExpand._bound) {
          btnLeftExpand._bound = true;
          btnLeftExpand.addEventListener('click', function(e) {
            e.preventDefault();
            document.body.classList.remove('panel-left-collapsed');
            localStorage.setItem('panel-left-collapsed', 'false');
          });
        }

        if (btnRightCollapse && !btnRightCollapse._bound) {
          btnRightCollapse._bound = true;
          btnRightCollapse.addEventListener('click', function(e) {
            e.preventDefault();
            document.body.classList.add('panel-right-collapsed');
            localStorage.setItem('panel-right-collapsed', 'true');
          });
        }

        if (btnRightExpand && !btnRightExpand._bound) {
          btnRightExpand._bound = true;
          btnRightExpand.addEventListener('click', function(e) {
            e.preventDefault();
            document.body.classList.remove('panel-right-collapsed');
            localStorage.setItem('panel-right-collapsed', 'false');
          });
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', setupPanelToggles);
      } else {
        setupPanelToggles();
      }

      if (typeof document$ !== 'undefined') {
        document$.subscribe(setupPanelToggles);
      }
    })();
  </script>
{% endblock %}
