{% extends "main.html" %}

{% block extrahead %}
<script>
  (function() {
    var path = window.location.pathname;
    // Check if the 404 URL ends with .md or .md/
    var match = path.match(/^(.*)\.md(\/)?$/i);
    if (match) {
      var cleanPath = match[1] + '/';
      var target = cleanPath + window.location.search + window.location.hash;
      window.location.replace(target);
    }
  })();
</script>
{% endblock %}

{% block content %}

<div style="padding: 3rem 1rem; text-align: center; max-width: 600px; margin: 0 auto;">

    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

  <h1 style="font-size: 1.6rem; font-weight: 700; color: #f1f5f9; margin-bottom: 0.5rem; letter-spacing: -0.02em;">404 — Document Not Found</h1>
